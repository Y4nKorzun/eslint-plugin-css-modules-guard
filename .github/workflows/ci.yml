name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of each declared range. The Node floor is pinned exactly rather than
        # written '20': that resolves to the newest 20.x, which would never exercise the
        # floor engines.node actually promises.
        node-version: ['20.19.0', '22', '24']
        eslint-version: ['9', '10']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint-version }}
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The gate itself is portable across Node 22.5+ (test:coverage passes
          # --test-coverage-exclude, added in v22.5.0). Pinned to one version so the matrix above
          # does not run the same thresholds six times.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run pack:check

  # The unit tests simulate a missing compiler through the loader seams, but devDependencies hide
  # the packaging half of the promise: a stray top-level `import 'sass'` would still pass them.
  # Only a real install into a project that has none of the optional peers proves it.
  optional-peers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Lint plain CSS Modules with no compilers installed
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund eslint "$RUNNER_TEMP"/eslint-plugin-css-modules-guard-*.tgz
          test ! -d node_modules/sass
          test ! -d node_modules/less
          printf "import cssModules from 'eslint-plugin-css-modules-guard';\nexport default [cssModules.configs.recommended];\n" > eslint.config.mjs
          printf ".root {}\n.primary {}\n" > Button.module.css
          printf "import styles from './Button.module.css';\nstyles.root;\nstyles.primary;\n" > Button.js
          npx eslint Button.js
