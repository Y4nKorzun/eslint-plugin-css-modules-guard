name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares "engines.node": ">=20" and
        # "peerDependencies.eslint": "^9.0.0 || ^10.0.0" - cover both ends of each range.
        node-version: ['20', '22', '24']
        eslint-version: ['9', '10']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint-version }}
      - run: npm run test:coverage
      - name: Check npm package layout
        if: matrix.node-version == '24' && matrix.eslint-version == '10'
        run: npm run pack:check
