name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares "engines.node": ">=20" and
        # "peerDependencies.eslint": "^9.0.0 || ^10.0.0" - cover both ends of each range.
        node-version: ['20', '22', '24']
        eslint-version: ['9', '10']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint-version }}
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The gate itself is portable across Node 22.5+ (test:coverage passes
          # --test-coverage-exclude, added in v22.5.0). Pinned to one version so the matrix above
          # does not run the same thresholds six times.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run pack:check
